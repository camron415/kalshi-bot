[package]
name = "kalshi-predictive-bot"
version = "1.0.0"
edition = "2021"
description = "Kalshi-only predictive trading bot using AI and external data."
keywords = ["kalshi", "predictive", "trading-bot", "ai", "grok-4"]
authors = ["Your Name"]
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
